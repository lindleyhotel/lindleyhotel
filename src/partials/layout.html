<!doctype html>
<html lang="{{page.lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="{{page.robots}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta name="theme-color" content="#1c2e25">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{name}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{siteUrl}}/assets/img/og-image.jpg">
  <meta property="og:locale" content="en_ZA">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css?v={{cssVersion}}">
  {{hotelJsonLd}}
  {{pageJsonLd}}
</head>
<body class="page-{{page.nav}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  <main id="main">
<!--CONTENT-->
  </main>
  {{> footer}}
  <script src="/assets/js/main.js?v={{cssVersion}}" defer></script>
</body>
</html>
