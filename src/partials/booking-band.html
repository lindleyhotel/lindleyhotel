<section class="booking-band" aria-labelledby="booking-band-title">
  <div class="wrap booking-band-inner">
    <div>
      <p class="eyebrow eyebrow-light">Reservations</p>
      <h2 id="booking-band-title" class="booking-band-title">See live availability and book in a few taps</h2>
      <p class="booking-band-text">Our rooms are booked through LekkeSlaap, South Africa's trusted accommodation platform. Pick your dates and room there, or speak to reception if you'd rather arrange things in person.</p>
    </div>
    <div class="booking-band-actions">
      <a class="btn btn-sand" href="{{lekkeslaapUrl}}" target="_blank" rel="noopener" data-book>Check dates on LekkeSlaap <span aria-hidden="true">↗</span></a>
      <a class="btn btn-outline-light" href="tel:{{phoneIntl}}">Call {{phoneDisplay}}</a>
    </div>
  </div>
</section>
